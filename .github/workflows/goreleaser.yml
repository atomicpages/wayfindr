# Builds every release target and checksums.txt with GoReleaser
# (.goreleaser.yaml) and uploads them as the "dist" artifact for
# install-test.yml.
#
# snapshot: true   builds with `make snapshot`; publishes nothing. Needs
#                  contents: read.
# snapshot: false  creates a draft GitHub release for the pushed v* tag, then
#                  attests build provenance for every archive. release.yml
#                  publishes the draft once the install test passes. The caller
#                  must grant contents: write, id-token: write,
#                  attestations: write.
#
# This workflow declares no permissions of its own: a called workflow can't
# ask for more than its caller grants, so each caller grants what its mode
# needs.
name: GoReleaser

on:
  workflow_call:
    inputs:
      snapshot:
        description: Build without publishing a draft release.
        type: boolean
        required: true

jobs:
  goreleaser:
    name: ${{ inputs.snapshot && 'Snapshot build' || 'Draft release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the version and changelog
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true

      - name: Build snapshot
        if: inputs.snapshot
        run: make snapshot

      # The changelog runs from the previous v* tag (the first commit before
      # the first release), never from a gate/* tag.
      - name: Draft release
        if: ${{ !inputs.snapshot }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$REF_TYPE:$TAG" in
          tag:v[0-9]*) ;;
          *) echo "::error::a release needs a v* tag, got $REF_TYPE $TAG"; exit 1 ;;
          esac
          GORELEASER_PREVIOUS_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$TAG^" 2>/dev/null ||
            git rev-list --max-parents=0 HEAD | tail -n 1)
          export GORELEASER_CURRENT_TAG="$TAG" GORELEASER_PREVIOUS_TAG
          goreleaser release --clean
      - name: Attest build provenance
        if: ${{ !inputs.snapshot }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
